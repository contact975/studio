runConfig:
  maxInstances: 1
  memoryMiB: 1024

scripts:
  buildCommand: npm install && npm run build

env:
  # --- ปลายทางฟอร์มนัดหมาย + ฟอร์มฝึกงาน (Make scenario "Integration Webhooks, LINE") ---
  # URL ของ webhook คือความลับ ใครรู้ URL ก็ยิงเข้ามาได้ทันที ไม่มีรหัสผ่านกั้น
  # เดิมเก็บเป็น value ตรงนี้ ทั้งที่ repo นี้เป็นสาธารณะ เท่ากับประกาศ URL ให้ทุกคนเห็น
  # (เคยมีสแปมยิงเข้า LINE จริงเมื่อ 29 ก.ย. 2569 — ดูที่มาใน src/app/api/booking/route.ts)
  # จึงย้ายมาเก็บใน Google Secret Manager แล้วออก URL ใหม่ทิ้งของเดิมเมื่อ 7 ต.ค. 2569
  #
  # ถ้าต้องเปลี่ยน URL อีก ลำดับสำคัญมาก:
  #   1. สร้าง webhook ใหม่ใน Make (อย่าเพิ่งสลับ trigger ของ scenario)
  #   2. เพิ่มเวอร์ชันใหม่ของ secret ตัวนี้
  #   3. deploy แล้วรอจนขึ้นจริง
  #   4. ค่อยสลับ trigger ของ scenario ไปตัวใหม่  5. ลบ webhook เก่า
  # สลับใน Make ก่อนที่ deploy จะเสร็จ = ฟอร์มส่งไม่ถึงปลายทางตลอดช่วงที่ build อยู่
  #
  # ห้ามพิมพ์ URL เอง ให้คัดลอกจากโมดูล Webhooks ใน Make — เคยพิมพ์ l กับ i เป็นเลข 1
  # แล้ว webhook ตอบ 410 ฟอร์มนัดหมายใช้ไม่ได้อยู่นานโดยไม่มีใครรู้

  - variable: MAKE_WEBHOOK_URL
    secret: MAKE_WEBHOOK_URL
    availability:
      - RUNTIME
  # --- รีวิว Google บนหน้าแรก (src/app/api/google-reviews) ---
  # key อยู่ใน Google Secret Manager (secret ชื่อ GOOGLE_PLACES_API_KEY)
  # service account firebase-app-hosting-compute@… ได้สิทธิ์ Secret Manager Secret Accessor แล้ว
  # key ถูกจำกัดให้ใช้ได้เฉพาะ Places API (New) — ดูรายละเอียดใน route
  - variable: GOOGLE_PLACES_API_KEY
    secret: GOOGLE_PLACES_API_KEY
    availability:
      - RUNTIME
  # Place ID ของ IC Accounting & Service (ค้นจากชื่อ+ที่อยู่ตอน deploy ครั้งแรก) — ไม่ใช่ความลับ
  # ใส่ไว้จะได้ไม่ต้องเรียก searchText ทุกรอบ และไม่เสี่ยงค้นเจอผิดร้าน
  - variable: GOOGLE_PLACE_ID
    value: ChIJL7RV5xgl2jARQ2bFaNMPxpk
    availability:
      - RUNTIME
  # --- Google Analytics 4 ---
  # Measurement ID (G-XXXXXXXXXX) ไม่ใช่ความลับ ตัวมันเองอยู่ในหน้าเว็บให้ใครก็เห็นได้อยู่แล้ว
  # ต้องมี BUILD ด้วย เพราะ NEXT_PUBLIC_* ถูกฝังเข้าไฟล์ตอน build ไม่ใช่อ่านตอนรัน
  # ถ้าลบบรรทัดนี้ออก สคริปต์ GA จะไม่ถูกเรนเดอร์เลย (ดู components/analytics/google-analytics.tsx)
  - variable: NEXT_PUBLIC_GA_ID
    value: G-R6PWYY1P03
    availability:
      - BUILD
      - RUNTIME
